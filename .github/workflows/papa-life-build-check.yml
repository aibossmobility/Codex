name: Papa Life Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    name: Typecheck and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SQLite runtime dependencies
        run: |
          pnpm --dir node_modules/.pnpm/sqlite3@5.1.7/node_modules/sqlite3 run install
          pnpm --dir node_modules/.pnpm/better-sqlite3@12.8.0/node_modules/better-sqlite3 run install

      - name: Run TypeScript check
        run: pnpm check

      - name: Build Papa Life
        run: pnpm build
